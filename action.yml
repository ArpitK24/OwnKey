name: OwnKey Review
description: AI pull request reviews on your own model key. Summary, walkthrough, inline comments with one-click fixes, incremental reviews, and @ownkey chat.
author: ArpitK24
branding:
  icon: shield
  color: orange

inputs:
  provider:
    description: openai, anthropic, gemini, or ollama
    required: true
  api-key:
    description: Provider API key (pass a secret). For Ollama Cloud, your OLLAMA_API_KEY. Not needed for a local Ollama.
    required: false
    default: ''
  model:
    description: Model to use. Defaults to OwnKey's current default for the provider.
    required: false
    default: ''
  endpoint:
    description: Ollama server URL (https://ollama.com for Ollama Cloud), or an OpenAI-compatible base URL with provider openai.
    required: false
    default: ''
  severity:
    description: Minimum severity to report (critical, high, medium, low, info). Defaults to reviews.severity in .ownkey.yml, else low.
    required: false
    default: ''
  fail-on:
    description: Fail the job when a new finding is at or above this severity. Empty never fails.
    required: false
    default: ''
  max-files:
    description: Maximum changed files to review. Defaults to reviews.max_files in .ownkey.yml, else 25.
    required: false
    default: ''
  max-steps:
    description: Tool rounds the reviewer may use to investigate the repository.
    required: false
    default: '6'
  comment:
    description: Post the review on the pull request. Set to false to only write the job summary and SARIF.
    required: false
    default: 'true'
  base:
    description: For push events, the ref to review against (default HEAD~1). Pull requests always review against their base.
    required: false
    default: ''
  upload-sarif:
    description: Upload findings to GitHub code scanning (needs security-events write).
    required: false
    default: 'true'
  version:
    description: OwnKey version to install from npm.
    required: false
    default: latest

outputs:
  findings:
    description: Number of new findings in this run.
    value: ${{ steps.review.outputs.findings }}
  sarif-file:
    description: Path to the SARIF report.
    value: ${{ steps.review.outputs.sarif }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install OwnKey
      shell: bash
      run: npm install -g "ownkey@${{ inputs.version }}"

    - name: Configure provider
      shell: bash
      env:
        OWNKEY_NO_KEYCHAIN: '1'
        OK_PROVIDER: ${{ inputs.provider }}
        OK_KEY: ${{ inputs.api-key }}
        OK_MODEL: ${{ inputs.model }}
        OK_ENDPOINT: ${{ inputs.endpoint }}
      run: |
        args=(config --provider "$OK_PROVIDER" --no-database --yes)
        if [ -n "$OK_KEY" ]; then
          if [ "$OK_PROVIDER" = "ollama" ]; then echo "OLLAMA_API_KEY=$OK_KEY" >> "$GITHUB_ENV"; else args+=(--api-key "$OK_KEY"); fi
        fi
        [ -n "$OK_MODEL" ] && args+=(--model "$OK_MODEL")
        [ -n "$OK_ENDPOINT" ] && args+=(--endpoint "$OK_ENDPOINT")
        ownkey "${args[@]}"

    - name: Review the pull request
      id: review
      if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
      shell: bash
      env:
        OWNKEY_NO_KEYCHAIN: '1'
        GITHUB_TOKEN: ${{ github.token }}
        OK_SEVERITY: ${{ inputs.severity }}
        OK_FAIL_ON: ${{ inputs.fail-on }}
        OK_MAX_FILES: ${{ inputs.max-files }}
        OK_MAX_STEPS: ${{ inputs.max-steps }}
        OK_COMMENT: ${{ inputs.comment }}
      run: |
        out="$RUNNER_TEMP/ownkey"
        mkdir -p "$out"
        args=(pr review --max-steps "$OK_MAX_STEPS" --sarif-output "$out/ownkey.sarif" --json-output "$out/result.json")
        [ -n "$OK_SEVERITY" ] && args+=(--severity "$OK_SEVERITY")
        [ -n "$OK_MAX_FILES" ] && args+=(--max-files "$OK_MAX_FILES")
        [ -n "$OK_FAIL_ON" ] && args+=(--fail-on "$OK_FAIL_ON")
        [ "$OK_COMMENT" != "true" ] && args+=(--dry-run)
        set +e
        ownkey "${args[@]}"
        code=$?
        set -e
        if [ "$code" -ge 2 ]; then exit "$code"; fi
        echo "gate=$code" >> "$GITHUB_OUTPUT"
        echo "findings=$(node -e "try{console.log(require('$out/result.json').findings.length)}catch{console.log(0)}")" >> "$GITHUB_OUTPUT"
        echo "sarif=$out/ownkey.sarif" >> "$GITHUB_OUTPUT"

    - name: Review a push
      id: push
      if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      shell: bash
      env:
        OWNKEY_NO_KEYCHAIN: '1'
        OK_BASE: ${{ inputs.base }}
        OK_SEVERITY: ${{ inputs.severity }}
        OK_FAIL_ON: ${{ inputs.fail-on }}
        OK_MAX_FILES: ${{ inputs.max-files }}
        OK_MAX_STEPS: ${{ inputs.max-steps }}
      run: |
        out="$RUNNER_TEMP/ownkey"
        mkdir -p "$out"
        args=(review --base "${OK_BASE:-HEAD~1}" --max-steps "$OK_MAX_STEPS" --format json --output "$out/result.json"
              --sarif-output "$out/ownkey.sarif" --markdown-output "$out/ownkey.md")
        [ -n "$OK_SEVERITY" ] && args+=(--severity "$OK_SEVERITY")
        [ -n "$OK_MAX_FILES" ] && args+=(--max-files "$OK_MAX_FILES")
        [ -n "$OK_FAIL_ON" ] && args+=(--fail-on "$OK_FAIL_ON")
        set +e
        ownkey "${args[@]}"
        code=$?
        set -e
        if [ "$code" -ge 2 ]; then exit "$code"; fi
        cat "$out/ownkey.md" >> "$GITHUB_STEP_SUMMARY"
        echo "gate=$code" >> "$GITHUB_OUTPUT"
        echo "sarif=$out/ownkey.sarif" >> "$GITHUB_OUTPUT"

    - name: Answer @ownkey
      if: ${{ (github.event_name == 'issue_comment' && github.event.issue.pull_request) || github.event_name == 'pull_request_review_comment' }}
      shell: bash
      env:
        OWNKEY_NO_KEYCHAIN: '1'
        GITHUB_TOKEN: ${{ github.token }}
      run: ownkey pr reply

    - name: Upload to code scanning
      if: ${{ inputs.upload-sarif == 'true' && (steps.review.outputs.sarif != '' || steps.push.outputs.sarif != '') }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.review.outputs.sarif || steps.push.outputs.sarif }}
        category: ownkey

    - name: Apply severity gate
      if: ${{ steps.review.outputs.gate == '1' || steps.push.outputs.gate == '1' }}
      shell: bash
      run: |
        echo "::error::OwnKey found new issues at or above '${{ inputs.fail-on }}'."
        exit 1
