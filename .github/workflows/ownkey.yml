name: OwnKey review
on:
  pull_request:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write

concurrency:
  group: ownkey-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    # Pull requests, plus @ownkey comments from people with write access (keeps strangers off the model key)
    if: >-
      github.event_name == 'pull_request' ||
      ((github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) &&
       contains(github.event.comment.body, '@ownkey') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    env:
      OWNKEY_MODEL_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - name: Skip when no model key is set
        if: env.OWNKEY_MODEL_KEY == ''
        run: echo "::notice::Add an OLLAMA_API_KEY repository secret to turn on OwnKey reviews."
      - uses: actions/checkout@v4
        if: env.OWNKEY_MODEL_KEY != ''
        with:
          fetch-depth: 0
      - uses: ArpitK24/OwnKey@v1
        if: env.OWNKEY_MODEL_KEY != ''
        with:
          provider: ollama
          endpoint: https://ollama.com
          model: gpt-oss:120b
          api-key: ${{ secrets.OLLAMA_API_KEY }}
